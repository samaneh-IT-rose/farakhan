services:
  postgres:
    image: postgres:16-alpine
    container_name: farakhan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farakhan}
      POSTGRES_USER: ${POSTGRES_USER:-farakhan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farakhan_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farakhan} -d ${POSTGRES_DB:-farakhan}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: farakhan-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network the DB host is the "postgres" service.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://farakhan:farakhan_change_me@postgres:5432/farakhan}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional one-shot test runner:
  #   docker compose --profile test run --rm test
  test:
    build: .
    profiles: ["test"]
    environment:
      DATABASE_URL: "sqlite+aiosqlite://"
    entrypoint: ["sh", "-c", "pip install -r requirements-dev.txt && pytest -v"]

volumes:
  postgres_data:
